# ============================================================
#  Epic Wallet · Postgres + API + compilado del frontend.
#
#  Este archivo solo alcanza para levantar el proyecto en una
#  máquina de desarrollo:
#
#      docker compose up -d db        # solo la base
#      docker compose up -d           # todo
#
#  En el servidor se suma `docker-compose.servidor.yml`, que lo
#  conecta al proxy de borde. Esa composición está fijada en el
#  `.env` del servidor con COMPOSE_FILE, así que allá también
#  alcanza con `docker compose up -d`.
#
#  NINGÚN SERVICIO PUBLICA PUERTOS. La base no se asoma a
#  Internet ni a la red local: solo la ve la API, por la red
#  interna de este compose. Para mirarla a mano desde la máquina
#  de desarrollo está `docker compose exec db psql`.
#
#  Referencia: 02_Documento_Tecnico.md §16
# ============================================================
name: epic-wallet

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-epic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-epic_wallet}
      # Importes en numeric(14,2) y fechas en America/Argentina/Buenos_Aires.
      TZ: ${APP_TIMEZONE:-America/Argentina/Buenos_Aires}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-epic} -d ${POSTGRES_DB:-epic_wallet}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DB_SCHEMA: ${DB_SCHEMA:-public}
      APP_ENV: ${APP_ENV:-development}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Argentina/Buenos_Aires}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      PRICE_PROVIDER_ORDER: ${PRICE_PROVIDER_ORDER:-manual}
      PRICE_REFRESH_COOLDOWN_MINUTES: ${PRICE_REFRESH_COOLDOWN_MINUTES:-15}
      # Vacías hasta F17, que trae la autenticación propia. Con esto
      # vacío la aplicación levanta y se ve, pero nadie inicia sesión.
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/health > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Compila el frontend, lo deja en el volumen y termina.
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: "no"
    volumes:
      - web_dist:/destino

volumes:
  db_data:
  web_dist:
